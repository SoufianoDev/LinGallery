device.issue.permission.steps = Unlock the device|Connect the device using USB|Open the USB notification on the device|Select File Transfer, Transfer Files, File Transfer (MTP), or Android Auto|If a confirmation dialog appears, allow access|Return to LinGallery and press Retry|If necessary, disconnect and reconnect the USB cable
device.issue.permission.notes = Photo Transfer (PTP) may allow access to some photos, but it does not guarantee access to every image stored on the device. For the best compatibility and to ensure all available photos and albums can be scanned, prefer File Transfer, Transfer Files, File Transfer (MTP), or Android Auto.
